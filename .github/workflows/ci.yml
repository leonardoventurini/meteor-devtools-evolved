name: CI

on:
  push:
    branches:
      - development
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify & Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 26.5.1

      - name: Install Corepack
        run: npm install --global corepack@0.36.0

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Run lint
        run: yarn lint

      - name: Run typecheck
        run: yarn typecheck

      - name: Run tests
        run: yarn test

      - name: Build Chrome extension
        run: yarn build:chrome

      - name: Validate Chrome extension
        run: yarn validate:chrome

      - name: Build Firefox extension
        run: yarn build:firefox

      - name: Validate Firefox extension
        run: yarn validate:firefox

      - name: Lint Firefox package
        run: yarn web-ext lint --source-dir .output/firefox-mv2

      - name: Report all dependency advisories
        continue-on-error: true
        run: yarn audit:all

      - name: Enforce production dependency audit
        run: yarn audit

      - name: Audit Meteor fixture dependencies
        run: yarn audit:devapp

  meteor-integration:
    name: ${{ matrix.fixture }} Extension Integration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        fixture:
          - devapp-3.5
          - devapp-2.16
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 26.5.1

      - name: Install Corepack
        run: npm install --global corepack@0.36.0

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Install Meteor CLI
        run: npm install --global meteor --foreground-script

      - name: Install Meteor fixture dependencies
        working-directory: ${{ matrix.fixture }}
        run: meteor npm ci

      - name: Build Chrome extension
        run: yarn build:chrome

      - name: Validate Chrome extension
        run: yarn validate:chrome

      - name: Install Playwright Chromium
        run: yarn playwright install --with-deps chromium

      - name: Run Meteor extension integration tests
        run: node scripts/run-e2e.mjs ${{ matrix.fixture }}

      - name: Upload Playwright failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.fixture }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
